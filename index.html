<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#DCE2D7" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('gk:theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <title>Ganesh Kumar T — AI Systems &amp; Full-Stack Engineer</title>
    <meta
      name="description"
      content="Ganesh Kumar T — AI Systems &amp; Full-Stack Engineer building agentic AI, RAG pipelines and production ML infrastructure. Selected work, measured results, and the stack behind it."
    />

    <!-- Open Graph / social preview.
         Social crawlers require ABSOLUTE URLs, so these are the one place in the
         codebase that hard-codes the host. Everything else is relative and moves
         on its own. Update all three below together if the host changes again —
         a custom domain, say. A stale og:image is not a broken image on the
         page; it is a dead preview card everywhere the link has been shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ganesh-0509.github.io/" />
    <meta property="og:title" content="Ganesh Kumar T — AI Systems &amp; Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Agentic AI · RAG pipelines · production ML infrastructure. Selected work with measured results."
    />
    <meta property="og:image" content="https://ganesh-0509.github.io/profile.jpg" />
    <meta property="og:image:alt" content="Ganesh Kumar T — AI Systems &amp; Full-Stack Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ganesh-0509.github.io/profile.jpg" />

    <!-- Fonts: high-contrast editorial serif (display) + neutral sans (body) +
         JetBrains Mono for anything machine-readable (badges, metrics, the
         terminal). Preconnect first so the stylesheet request doesn't pay for
         DNS + TLS on the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
